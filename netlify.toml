[build]
  base      = "frontend"
  command   = "npm install && npm run netlify:build"
  publish   = "dist"

[functions]
  directory         = "netlify/functions"
  node_bundler      = "esbuild"
  included_files    = ["api/**"]

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
